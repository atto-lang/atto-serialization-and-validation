name: Pinned actor DATA ingress host reference
on:
  pull_request:
    paths: ['tools/actor_data_*.rs', '.github/workflows/actor-data-pinned-ingress-v1.yml']
  push:
    branches: [main]
    paths: ['tools/actor_data_*.rs', '.github/workflows/actor-data-pinned-ingress-v1.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          rustc --edition=2021 -D warnings --test tools/actor_data_pinned_ingress_v1.rs -o "$RUNNER_TEMP/ingress"
          "$RUNNER_TEMP/ingress"
          echo AUTHENTICATION_AND_GUEST_NOT_EXECUTED
