name: Zorde independently authored TypeSpec / JSON Schema parity (pilot)
on:
  push:
    paths:
      - 'contracts/zorde/**'
      - '.github/workflows/zorde-contract-parity.yml'
  pull_request:
    paths:
      - 'contracts/zorde/**'
      - '.github/workflows/zorde-contract-parity.yml'
permissions:
  contents: read
jobs:
  dual-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out unmodified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin required Node engine
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
      # Candidate upstream security remediation PR #235. This exact revision
      # must be replaced by a reviewed, independently CI-admitted release SHA.
      # Never use a floating action tag, npm install --no-save or an unlocked graph.
      - name: Compare independent schema authorities via production-audited lockfile
        uses: ORESoftware/typespec-json-schema-validator@da489a082bd5f05ce86a0c74393dc53934960125
        with:
          typespec: contracts/zorde/main.tsp
          schema: contracts/zorde/authored.schema.json
          instances: contracts/zorde/instances
          report: artifacts/zorde-schema-parity.json
          sarif: artifacts/zorde-schema-parity.sarif
          output_dir: artifacts/zorde-generated

      - name: Verify positive comparison contains executed differential evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('artifacts/zorde-schema-parity.json','utf8'));
          if(r.schema !== 'ores.typespec-json-schema-validator.report/v1'
            || r.status !== 'passed'
            || r.zeroUnexplainedFindings !== true
            || r.counts?.findings !== 0
            || r.coverage?.differentialInstanceValidation !== true
            || !(r.differential?.summary?.probesEvaluated > 0)
            || r.differential?.summary?.divergences !== 0) {
            throw Error('TJSV positive receipt missing clean executed differential proof');
          }
          JS

      - name: Make deliberately divergent independent schema without changing either authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq '."$defs".ValidationReport.properties.schemaVersion.const = 2' \
            contracts/zorde/authored.schema.json > artifacts/zorde-mutant.schema.json

      - name: Drift must fail the same parity tool and never create an admitted report
        id: drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@da489a082bd5f05ce86a0c74393dc53934960125
        with:
          typespec: contracts/zorde/main.tsp
          schema: artifacts/zorde-mutant.schema.json
          instances: contracts/zorde/instances
          report: artifacts/zorde-mutant-rejected.json
          sarif: ''
          output_dir: artifacts/zorde-mutant-generated

      - name: Assert meaningful schema-drift rejection, not an infrastructure failure
        shell: bash
        env:
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          set -euo pipefail
          test "$DRIFT_OUTCOME" = failure
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          // An action that failed to install dependencies, launch TypeSpec, or
          // emit a report does not prove our mutation was detected.
          const r=JSON.parse(readFileSync('artifacts/zorde-mutant-rejected.json','utf8'));
          if(r.schema !== 'ores.typespec-json-schema-validator.report/v1'
            || r.status !== 'stopped_for_evaluation'
            || r.zeroUnexplainedFindings !== false
            || r.counts?.findings < 1
            || !Array.isArray(r.findings)
            || !r.findings.some(f => f.resolutionState === 'unexplained')
            || r.error) {
            throw Error('negative mutant did not produce a semantic drift refusal');
          }
          JS
