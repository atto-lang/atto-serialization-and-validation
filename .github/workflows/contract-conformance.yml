name: Contract conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  schema-and-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked --all-targets --verbose
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # Bootstrap lockfile once; after review, replace with npm ci only.
      - name: Bootstrap and export integrity-pinned npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo ATTO_NPM_LOCK_BEGIN
          cat package-lock.json
          echo ATTO_NPM_LOCK_END
          npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/tsp compile contracts/v1/actor-envelope.tsp --no-emit
      - run: cargo install --locked --version 1.262.0 wasm-tools
      - run: wasm-tools component wit contracts/v1 --json > /dev/null

  fast-npm-lock-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate audited npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo ATTO_FAST_LOCK_BEGIN
          cat package-lock.json
          echo ATTO_FAST_LOCK_END
