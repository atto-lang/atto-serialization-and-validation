name: static-audit

on:
  push:
    branches:
      - main
      - 'harden/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format Rust source audit
        run: cargo fmt --manifest-path tools/static-audit/Cargo.toml -- --check
      - name: Lint Rust source audit
        run: cargo clippy --manifest-path tools/static-audit/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust source audit
        run: cargo test --manifest-path tools/static-audit/Cargo.toml
      - name: Audit Oreslang source invariants
        run: cargo run --quiet --manifest-path tools/static-audit/Cargo.toml
