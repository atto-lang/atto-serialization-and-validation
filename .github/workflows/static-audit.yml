name: static-audit

on:
  push:
    branches:
      - main
      - 'harden/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify shared serde guest fixture vectors (source-only)
        run: python3 -B scripts/check-serde-fixtures.py
      - name: Reject synthetic receipt tampering (host-only)
        run: python3 -B -m unittest discover -s tests/source_free -p 'test_serde_receipt_gate.py'
      - name: Build and test Rust audit
        run: cargo test --all-targets
      - name: Audit Oreslang source invariants
        run: cargo run --quiet --bin audit
